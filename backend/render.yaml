services:
  - type: web
    name: varsha-setu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "https://varsha-setu-six.vercel.app"
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: OPEN_METEO_TIMEOUT_SECONDS
        value: "8.0"
      - key: NOMINATIM_TIMEOUT_SECONDS
        value: "6.0"
      - key: NOMINATIM_MAX_DISTANCE_KM
        value: "60.0"
      - key: GEMINI_API_KEY
        sync: false
